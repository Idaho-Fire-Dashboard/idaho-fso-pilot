/* Reference datasets (apparatus catalog, agency directories). Filled after sign-in, before the app opens. */
window.__FSO_REF = { yi: [], z4: [], SM: [] };
window.__FSO_REF_LOADED = false;

/* Sends each /api call to the Apps Script backend as one POST and turns the reply back into a normal Response. */
window.FSO_API = async function (nativeFetch, url, init, token) {
  init = init || {};
  var q = url.indexOf('?');
  var path = q < 0 ? url : url.slice(0, q), query = q < 0 ? '' : url.slice(q);
  var method = String(init.method || 'GET').toUpperCase();
  var body = init.body == null ? null : (typeof init.body === 'string' ? init.body : await new Response(init.body).text());
  var json = function (status, obj) { return new Response(JSON.stringify(obj), { status: status, headers: { 'Content-Type': 'application/json' } }); };
  if (!window.FSO_BACKEND_URL) return json(503, { error: 'Backend address is not configured (config.js).' });

  async function call(p, m, b) {
    var r;
    try {
      r = await nativeFetch(window.FSO_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ path: p, query: query, method: m, token: token, body: b }),
        redirect: 'follow',
      });
    } catch (err) {
      return { status: 503, body: JSON.stringify({ error: 'Could not reach the backend. Check your connection and try again.' }) };
    }
    if (!r.ok) return { status: 503, body: JSON.stringify({ error: 'Backend unavailable (HTTP ' + r.status + '). Try again in a moment.' }) };
    try { return await r.json(); } catch (err) { return { status: 503, body: JSON.stringify({ error: 'Backend returned an unreadable reply. Try again in a moment.' }) }; }
  }

  var needRef = path === '/api/state' && method === 'GET' && !window.__FSO_REF_LOADED;
  var results = await Promise.all([call(path, method, body), needRef ? call('/api/reference', 'GET', null) : null]);
  var main = results[0], ref = results[1];
  if (needRef && (main.status || 200) === 200) {
    if ((ref.status || 200) !== 200) return new Response(ref.body, { status: ref.status, headers: { 'Content-Type': 'application/json' } });
    var data = JSON.parse(ref.body);
    ['yi', 'z4', 'SM'].forEach(function (k) {
      var target = window.__FSO_REF[k];
      target.length = 0;
      (data[k] || []).forEach(function (row) { target.push(row); });
    });
    window.__FSO_REF_LOADED = true;
  }
  return new Response(main.body, { status: main.status || 200, headers: { 'Content-Type': 'application/json' } });
};
