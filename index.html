<script>
/* Reference datasets (apparatus catalog, agency directories). Filled after sign-in, before the app opens. */
window.__FSO_REF = { yi: [], z4: [], SM: [] };
window.__FSO_REF_LOADED = false;

/* Sends each /api call to the Apps Script backend as one POST and turns the reply back into a normal Response. */
window.FSO_API = async function (nativeFetch, url, init, token) {
  init = init || {};
  var q = url.indexOf('?');
  var path = q < 0 ? url : url.slice(0, q), query = q < 0 ? '' : url.slice(q);
  var method = String(init.method || 'GET').toUpperCase();
  var body = init.body == null ? null : (typeof init.body === 'string' ? init.body : await new Response(init.body).text());
  var json = function (status, obj) { return new Response(JSON.stringify(obj), { status: status, headers: { 'Content-Type': 'application/json' } }); };
  if (!window.FSO_BACKEND_URL) return json(503, { error: 'Backend address is not configured (config.js).' });

  var canGz = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
  function toB64(u8) { var s = ''; for (var i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); }
  async function gz(text) { return toB64(new Uint8Array(await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())); }
  async function gunz(b64) { var bin = atob(b64), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
  var fail = function (msg) { return { status: 503, body: JSON.stringify({ error: msg }) }; };

  async function once(payload) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 120000) : null;
    var r;
    try {
      r = await nativeFetch(window.FSO_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payload,
        redirect: 'follow',
        signal: ctl ? ctl.signal : undefined,
      });
    } catch (err) {
      return fail(err && err.name === 'AbortError'
        ? 'The backend took longer than 2 minutes to answer. Check Saved status, then try again.'
        : 'Could not reach the backend. Check your connection and try again.');
    } finally { if (timer) clearTimeout(timer); }
    if (!r.ok) return fail('Backend unavailable (HTTP ' + r.status + '). Try again in a moment.');
    var out;
    try { out = await r.json(); } catch (err) { return fail('Backend returned an unreadable reply. Try again in a moment.'); }
    if (typeof out.bodyGz === 'string') {
      try { out.body = await gunz(out.bodyGz); } catch (err) { return fail('Backend reply could not be unpacked. Try again in a moment.'); }
    }
    return out;
  }

  async function call(p, m, b) {
    var req = { path: p, query: query, method: m, token: token, acceptGz: canGz };
    if (b != null && canGz && b.length > 20000) req.bodyGz = await gz(b); else req.body = b;
    var payload = JSON.stringify(req);
    var out = await once(payload);
    // Read-only calls are retried once after a short pause if the network dropped; saves are not,
    // because the server may already have recorded them.
    if (m === 'GET' && out.status === 503 && /reach the backend|unavailable/.test(out.body)) {
      await new Promise(function (r) { setTimeout(r, 1500); });
      out = await once(payload);
    }
    return out;
  }

  var needRef = path === '/api/state' && method === 'GET' && !window.__FSO_REF_LOADED;
  var results = await Promise.all([call(path, method, body), needRef ? call('/api/reference', 'GET', null) : null]);
  var main = results[0], ref = results[1];
  if (needRef && (main.status || 200) === 200) {
    if ((ref.status || 200) !== 200) return new Response(ref.body, { status: ref.status, headers: { 'Content-Type': 'application/json' } });
    var data = JSON.parse(ref.body);
    ['yi', 'z4', 'SM'].forEach(function (k) {
      var target = window.__FSO_REF[k];
      target.length = 0;
      (data[k] || []).forEach(function (row) { target.push(row); });
    });
    window.__FSO_REF_LOADED = true;
  }
  return new Response(main.body, { status: main.status || 200, headers: { 'Content-Type': 'application/json' } });
};

.fso-map-tools button{width:auto;min-width:34px;height:34px;padding:0 10px;border:0;border-bottom:1px solid #dbe3ed;background:#fff;color:#1d3f63;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;text-align:left}
.fso-map-tools button:last-child{border-bottom:0}
.fso-map-tools button:hover{background:#f1f5fa}
.fso-map-hint{position:absolute;left:10px;bottom:40px;z-index:800;background:rgba(15,29,46,.82);color:#fff;font:500 12px Inter,system-ui,sans-serif;padding:6px 10px;border-radius:8px;pointer-events:none;transition:opacity .4s}
#dashmap:fullscreen{height:100%!important;border-radius:0!important}
#dashmap:-webkit-full-screen{height:100%!important;border-radius:0!important}
html.fso-phone .grid{grid-template-columns:minmax(0,1fr)!important}
html.fso-phone .cb>div[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
html.fso-phone .grid>*,html.fso-phone .card{min-width:0!important;max-width:100%}
html.fso-phone .card{overflow-wrap:anywhere}
html.fso-phone .tiles{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
html.fso-phone .jumpto,html.fso-phone .jumpto *{white-space:normal!important}
html.fso-phone .jumpto{flex-wrap:wrap!important;height:auto!important;overflow:visible!important}
html.fso-phone table.fso-stack,html.fso-phone table.fso-stack tbody,html.fso-phone table.fso-stack thead{display:block;width:100%}
html.fso-phone table.fso-stack tr.fso-head{display:none}
html.fso-phone table.fso-stack tr{display:block;border:1px solid #e1e8f0;border-radius:8px;padding:6px 10px;margin:0 0 8px;background:#fff}
html.fso-phone table.fso-stack td,html.fso-phone table.fso-stack th{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0!important;padding:3px 0!important;text-align:right!important;white-space:normal!important;width:auto!important}
html.fso-phone table.fso-stack td::before,html.fso-phone table.fso-stack th::before{content:attr(data-label);flex:0 0 38%;text-align:left;font:600 10.5px Inter,system-ui,sans-serif;letter-spacing:.3px;text-transform:uppercase;color:#5b6b7d}
html.fso-phone table.fso-stack .fso-first{display:block;text-align:left!important;font-weight:600;padding:2px 0 4px!important}
html.fso-phone table.fso-stack .fso-first::before,html.fso-phone table.fso-stack [data-label=""]::before{display:none}
html.fso-phone table.fso-stack [data-label=""]{display:block;text-align:left!important}
html.fso-phone table.fso-stack .fso-v{flex:1 1 auto;min-width:0;text-align:right}
html.fso-phone table.fso-stack .fso-long{display:block;text-align:left!important}
html.fso-phone table.fso-stack .fso-long::before{display:block;margin:2px 0 2px}
html.fso-phone table.fso-stack .fso-long .fso-v{display:block;text-align:left}
html.fso-phone .jumpto h2,html.fso-phone .card h2{overflow-wrap:normal!important;word-break:normal!important}
